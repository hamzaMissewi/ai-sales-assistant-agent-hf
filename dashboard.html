<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leads Dashboard</title>
<style>
:root{--brand:#059669;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:28px 18px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:20px}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
nav .pills{display:flex;gap:8px;flex-wrap:wrap}
nav a{color:var(--brand);text-decoration:none;font-size:13.5px;font-weight:600}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
.pill:hover{border-color:var(--brand);color:var(--brand)}
.pill.active{background:var(--brand);border-color:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.card h2 .count{font-size:12px;background:var(--brand);color:#fff;border-radius:999px;padding:2px 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #f1f5f9;vertical-align:top}
tr:last-child td{border-bottom:none}
.empty{color:var(--muted);font-size:13px;padding:14px 4px}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700}
.b5{background:#dcfce7;color:#166534}.b4{background:#dbeafe;color:#1e40af}
.b3{background:#fef3c7;color:#92400e}.b2,.b1{background:#fee2e2;color:#991b1b}
.time{color:var(--muted);font-size:11.5px;white-space:nowrap}
@media print{nav .pills{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <h1>Leads Dashboard</h1>
    <div class="pills" id="pills"></div>
    <a href="/">&larr; back to assistant</a>
  </nav>
  <p class="sub" id="sub"></p>
  <div class="grid">
    <div class="card"><h2>Leads <span class="count" id="cLeads">0</span></h2><div id="tLeads"></div></div>
    <div class="card"><h2>Demo requests <span class="count" id="cDemos">0</span></h2><div id="tDemos"></div></div>
  </div>
</div>
<script>
const pills=document.getElementById("pills"), sub=document.getElementById("sub");
let clients=[],current=null;

async function boot(){
  try{ clients=await (await fetch("/clients")).json(); }catch(e){ pills.innerHTML="<span>server unreachable</span>"; return; }
  clients.forEach(c=>{
    const b=document.createElement("button"); b.className="pill"; b.textContent=c.brand_name;
    b.onclick=()=>load(c.id);
    pills.appendChild(b);
  });
  if(clients.length) load(clients[0].id);
}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ts=>ts?new Date(ts*1000).toLocaleString([],{dateStyle:"short",timeStyle:"short"}):"";
function table(headers,rows){
  if(!rows.length) return `<div class="empty">Nothing here yet.</div>`;
  return `<table><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr>`+rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")+"</table>";
}
function scoreBadge(s){
  s=Number(s)||0;
  return `<span class="badge b${s}">${s}/5</span>`;
}
async function load(id){
  current=id;
  document.querySelectorAll(".pill").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  const c=clients.find(x=>x.id===id);
  sub.textContent=`${c.brand_name} · agent ${c.agent_name} · handoff ${c.handoff||"n/a"}`;
  const [leads,demos]=await Promise.all([
    fetch(`/leads/${id}`).then(r=>r.json()).catch(()=>[]),
    fetch(`/demos/${id}`).then(r=>r.json()).catch(()=>[])
  ]);
  document.getElementById("cLeads").textContent=leads.length;
  document.getElementById("cDemos").textContent=demos.length;
  document.getElementById("tLeads").innerHTML=table(
    ["Name","Contact","Need","Score","Source","Time"],
    leads.map(l=>[esc(l.name),esc(l.email)+(l.phone?'<br>'+esc(l.phone):""),esc(l.need),scoreBadge(l.score),esc(l.source),`<span class="time">${fmt(l.ts)}</span>`]));
  document.getElementById("tDemos").innerHTML=table(
    ["Name","Email","Slot","Timezone","Requested"],
    demos.map(d=>[esc(d.name),esc(d.email),`${esc(d.date)} · ${esc(d.time)}`,esc(d.timezone),`<span class="time">${fmt(d.ts)}</span>`]));
}
pills.addEventListener("click",()=>{});
boot();
</script>
</body>
</html>
